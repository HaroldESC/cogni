name: cogni
description: Entrenamiento cognitivo gamificado, local y de código abierto.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

# Dependencias de runtime. La persistencia (drift), la identidad global (uuid)
# y el framework de juegos llegan en fases posteriores (F1-F3).
dependencies:
  flutter:
    sdk: flutter
  # Necesario para que Material no caiga al ingles en tooltips y dialogos (D-027).
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  riverpod_annotation: ^4.0.7

dev_dependencies:
  build_runner: ^2.16.1
  flutter_test:
    sdk: flutter
  riverpod_generator: ^4.0.9
  very_good_analysis: ^11.0.0

flutter:
  # Genera AppLocalizations desde lib/l10n/app_es.arb (D-027).
  generate: true
  uses-material-design: true