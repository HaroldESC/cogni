name: cogni
description: Entrenamiento cognitivo gamificado, local y de código abierto.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

# Dependencias de runtime. Persistencia (drift) e identidad global (uuid) desde F1
# (D-004, D-015, D-034); el framework de juegos llega en F2.
# Ojo: NO `sqlite3_flutter_libs` — es obsoleto desde package:sqlite3 3.x, que
# empaqueta el binario de SQLite con los hooks de Dart (D-034).
dependencies:
  drift: ^2.35.1
  flutter:
    sdk: flutter
  # Necesario para que Material no caiga al ingles en tooltips y dialogos (D-027).
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  path: ^1.9.1
  path_provider: ^2.1.6
  riverpod_annotation: ^4.0.7
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.35.1
  flutter_test:
    sdk: flutter
  riverpod_generator: ^4.0.9
  very_good_analysis: ^11.0.0

flutter:
  # Genera AppLocalizations desde lib/l10n/app_es.arb (D-027).
  generate: true
  uses-material-design: true